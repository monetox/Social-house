/* ============================== HELPERS ============================== */
function useHashRoute() {
  const [hash, setHash] = useState(window.location.hash || "#/");
  useEffect(() => {
    const onChange = () => setHash(window.location.hash || "#/");
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  return hash;
}

function navigate(href) {
  window.location.hash = href;
  window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}

function Reveal({ children, className = "", delay = 0, as: Tag = "div" }) {
  const ref = useRef(null);
  const [inView, setInView] = useState(false);
  useEffect(() => {
    const el = ref.current;
    if (!el) return;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { setInView(true); obs.unobserve(el); } });
    }, { threshold: 0.15 });
    obs.observe(el);
    return () => obs.disconnect();
  }, []);
  return (
    <Tag ref={ref} className={`reveal ${inView ? "in" : ""} ${className}`} style={{ animationDelay: `${delay}ms` }}>
      {children}
    </Tag>
  );
}

function fmtDate(d) {
  if (!d) return "";
  const parts = d.split("-");
  if (parts.length !== 3) return d;
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${parseInt(parts[2],10)} ${months[parseInt(parts[1],10)-1]} ${parts[0]}`;
}
function nightsBetween(a, b) {
  if (!a || !b) return 0;
  const d1 = new Date(a), d2 = new Date(b);
  const diff = Math.round((d2.getTime() - d1.getTime()) / 86400000);
  return diff > 0 ? diff : 0;
}
function money(n) { return `$${n.toLocaleString("en-US")}`; }

function Stepper({ value, onChange, min = 1, max = 10, label }) {
  return (
    <div className="flex items-center gap-3">
      <button type="button" onClick={() => onChange(Math.max(min, value - 1))}
        className="tap w-8 h-8 rounded-full border border-espresso/20 flex items-center justify-center hover:border-espresso/50 disabled:opacity-30"
        disabled={value <= min} aria-label={`Decrease ${label}`}>
        <MinusIcon size={14} />
      </button>
      <span className="w-6 text-center font-mono text-[14px] tabular-nums">{value}</span>
      <button type="button" onClick={() => onChange(Math.min(max, value + 1))}
        className="tap w-8 h-8 rounded-full border border-espresso/20 flex items-center justify-center hover:border-espresso/50 disabled:opacity-30"
        disabled={value >= max} aria-label={`Increase ${label}`}>

      </button>
    </div>
  );
}

function Modal({ open, onClose, children, wide = false }) {
  useEffect(() => {
    if (!open) return;
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [open, onClose]);
  if (!open) return null;
  return (
    <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 sm:p-6">
      <div className="absolute inset-0 bg-espresso/50 backdrop-blur-sm" onClick={onClose} />
      <div className={`relative bg-cream w-full ${wide ? "sm:max-w-3xl" : "sm:max-w-lg"} max-h-[92vh] overflow-y-auto rounded-t-[28px] sm:rounded-[28px] border border-line shadow-2xl animate-[fadeInUp_0.35s_ease]`}>
        <button onClick={onClose} className="tap absolute top-5 right-5 w-9 h-9 rounded-full bg-white/80 border border-line flex items-center justify-center hover:bg-white z-10" aria-label="Close">

    </div>
  );
}

function BookingPage({ booking, setBooking, initialStep }) {
  const [step, setStep] = useState(initialStep || 0);
  const [guestInfo, setGuestInfo] = useState({ name: "", email: "", phone: "", requests: "" });
  const room = ROOMS.find(r => r.id === booking.selectedRoomId) || null;
  const nights = nightsBetween(booking.checkIn, booking.checkOut) || 1;
  const addonsTotal = booking.addons.reduce((sum, id) => {
    const a = ADDONS.find(x => x.id === id);
    if (!a) return sum;
    return sum + (a.unit === "/ night" ? a.price * nights : a.price);
  }, 0);
  const roomTotal = room ? room.price * nights : 0;
  const total = roomTotal + addonsTotal;

  const toggleAddon = (id) => setBooking(b => ({
    ...b, addons: b.addons.includes(id) ? b.addons.filter(a => a !== id) : [...b.addons, id]
  }));

  const canNext = [
    !!(booking.checkIn && booking.checkOut && nightsBetween(booking.checkIn, booking.checkOut) > 0),
    !!room,
    true,
    !!(guestInfo.name && guestInfo.email),
    true,
  ];

  if (step === 5) {
    const ref = "SH-" + Math.random().toString(36).slice(2, 8).toUpperCase();
    return (
      <section className="max-w-[720px] mx-auto px-5 sm:px-8 pt-16 sm:pt-24 pb-28 text-center">
        <Reveal>
          <div className="w-16 h-16 rounded-full bg-sage/15 text-sage flex items-center justify-center mx-auto mb-6"><CheckIcon size={26} /></div>
          <h1 className="text-[30px] sm:text-[38px] font-semibold tracking-tight">You're booked in.</h1>
          <p className="text-[15px] text-espresso2 mt-3">Confirmation sent to {guestInfo.email || "your inbox"}. We'll see you at the door.</p>
        </Reveal>
        <Reveal delay={100} className="mt-10 rounded-[28px] border border-line bg-cream2 p-7 sm:p-9 text-left">
          <div className="flex items-center justify-between pb-5 border-b border-line">
            <span className="font-mono text-[13px] text-espresso2">BOOKING REFERENCE</span>
            <span className="font-mono text-[15px] font-semibold">{ref}</span>
          </div>
          <div className="py-5 space-y-3 border-b border-line">
            <div className="flex justify-between text-[14.5px]"><span className="text-espresso2">Room</span><span className="font-medium">{room?.name}</span></div>
            <div className="flex justify-between text-[14.5px]"><span className="text-espresso2">Check-in</span><span className="font-medium">{fmtDate(booking.checkIn)}</span></div>
            <div className="flex justify-between text-[14.5px]"><span className="text-espresso2">Check-out</span><span className="font-medium">{fmtDate(booking.checkOut)}</span></div>
            <div className="flex justify-between text-[14.5px]"><span className="text-espresso2">Guests</span><span className="font-medium">{booking.guests}</span></div>
          </div>
          <div className="pt-5 flex justify-between items-center">
            <span className="text-[14.5px] text-espresso2">Total paid</span>
            <span className="text-[22px] font-semibold font-mono">{money(total)}</span>
          </div>
        </Reveal>
        <Reveal delay={180} className="mt-8 flex flex-wrap gap-3 justify-center">
          <PrimaryButton href="#/">Back to Home</PrimaryButton>
          <SecondaryButton href="#/experience">Plan the Neighborhood</SecondaryButton>
        </Reveal>
      </section>
    );
  }

  return (
    <section className="max-w-[1000px] mx-auto px-5 sm:px-8 pt-12 sm:pt-16 pb-28">
      <Reveal>
        <span className="text-[12px] font-mono tracking-wide text-espresso2">RESERVATION</span>
        <h1 className="text-[30px] sm:text-[40px] font-semibold tracking-tight mt-2">Book your stay</h1>
      </Reveal>
      <Reveal delay={60} className="mt-8"><BookingStepper step={step} /></Reveal>

      <div className="grid lg:grid-cols-[1fr_320px] gap-10 mt-9">
        <Reveal delay={100} key={step} className="reveal in rounded-[28px] border border-line bg-cream2/50 p-6 sm:p-8">
          {step === 0 && (
            <div>
              <h2 className="text-[20px] font-semibold tracking-tight mb-6">When are you staying?</h2>
              <div className="grid sm:grid-cols-2 gap-4">
                <label className="block">
                  <span className="text-[11.5px] font-mono text-espresso2">CHECK-IN</span>
                  <input type="date" value={booking.checkIn} onChange={(e) => setBooking(b => ({ ...b, checkIn: e.target.value }))}
                    className="mt-1.5 w-full px-4 py-3 rounded-xl border border-line bg-white text-[14.5px] focus:outline-none focus:border-espresso/40" />
                </label>
                <label className="block">
                  <span className="text-[11.5px] font-mono text-espresso2">CHECK-OUT</span>
                  <input type="date" value={booking.checkOut} min={booking.checkIn} onChange={(e) => setBooking(b => ({ ...b, checkOut: e.target.value }))}
                    className="mt-1.5 w-full px-4 py-3 rounded-xl border border-line bg-white text-[14.5px] focus:outline-none focus:border-espresso/40" />
                </label>
              </div>
              <div className="flex items-center justify-between mt-6 p-4 rounded-xl bg-white border border-line">
                <span className="text-[14px] font-medium">Guests</span>
                <Stepper value={booking.guests} onChange={(v) => setBooking(b => ({ ...b, guests: v }))} min={1} max={8} label="guests" />
              </div>
              {!canNext[0] && booking.checkIn && <p className="text-[13px] text-brassDeep mt-3">Check-out needs to be after check-in.</p>}
            </div>
          )}

          {step === 1 && (
            <div>
              <h2 className="text-[20px] font-semibold tracking-tight mb-6">Choose a room</h2>
              <div className="space-y-3">
                {ROOMS.map(r => (
                  <button key={r.id} onClick={() => setBooking(b => ({ ...b, selectedRoomId: r.id }))}
                    className={`w-full text-left flex items-center gap-4 p-4 rounded-2xl border transition-all duration-300 ${booking.selectedRoomId === r.id ? "border-brass bg-white shadow-sm" : "border-line bg-white/50 hover:border-espresso/25"}`}>
                    <div className="w-16 h-16 rounded-xl overflow-hidden shrink-0">
                      <img src={r.image} alt={r.name} className="w-full h-full object-cover" />
                    </div>
                    <div className="flex-1 min-w-0">
                      <div className="flex items-center justify-between gap-2">
                        <span className="font-semibold text-[15px] truncate">{r.name}</span>
                        <span className="font-mono text-[14.5px] shrink-0">{money(r.price)}<span className="text-espresso2 text-[12px]">/night</span></span>
                      </div>
                      <span className="text-[12.5px] text-espresso2">{r.sqm} m² · up to {r.guests} guests</span>
                    </div>
                    <span className={`w-5 h-5 rounded-full border shrink-0 flex items-center justify-center ${booking.selectedRoomId === r.id ? "bg-brass border-brass" : "border-espresso/20"}`}>
                      {booking.selectedRoomId === r.id && <CheckIcon size={11} className="text-cream" strokeWidth={3} />}
                    </span>
                  </button>
                ))}
              </div>
            </div>
          )}

          {step === 2 && (
            <div>
              <h2 className="text-[20px] font-semibold tracking-tight mb-1">Add anything to the stay?</h2>
              <p className="text-[13.5px] text-espresso2 mb-6">Optional — skip ahead if you'd rather decide at the desk.</p>
              <div className="space-y-3">
                {ADDONS.map(a => {
                  const checked = booking.addons.includes(a.id);
                  return (
                    <button key={a.id} onClick={() => toggleAddon(a.id)}
                      className={`w-full text-left flex items-center gap-4 p-4 rounded-2xl border transition-all duration-300 ${checked ? "border-brass bg-white shadow-sm" : "border-line bg-white/50 hover:border-espresso/25"}`}>
                      <span className={`w-5 h-5 rounded-md border shrink-0 flex items-center justify-center ${checked ? "bg-brass border-brass" : "border-espresso/20"}`}>
                        {checked && <CheckIcon size={11} className="text-cream" strokeWidth={3} />}
                      </span>
                      <div className="flex-1">
                        <div className="text-[14.5px] font-medium">{a.name}</div>
                        <div className="text-[12.5px] text-espresso2">{a.desc}</div>
                      </div>
                      <span className="font-mono text-[13.5px] shrink-0">{money(a.price)} <span className="text-espresso2 text-[11px]">{a.unit}</span></span>
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {step === 3 && (
            <div>
              <h2 className="text-[20px] font-semibold tracking-tight mb-6">Who's checking in?</h2>
              <div className="grid sm:grid-cols-2 gap-4">
                <label className="block">
                  <span className="text-[11.5px] font-mono text-espresso2">FULL NAME</span>
                  <input required value={guestInfo.name} onChange={(e) => setGuestInfo(g => ({ ...g, name: e.target.value }))}
                    className="mt-1.5 w-full px-4 py-3 rounded-xl border border-line bg-white text-[14.5px] focus:outline-none focus:border-espresso/40" />
                </label>
                <label className="block">
                  <span className="text-[11.5px] font-mono text-espresso2">EMAIL</span>
                  <input required type="email" value={guestInfo.email} onChange={(e) => setGuestInfo(g => ({ ...g, email: e.target.value }))}
                    className="mt-1.5 w-full px-4 py-3 rounded-xl border border-line bg-white text-[14.5px] focus:outline-none focus:border-espresso/40" />
                </label>
                <label className="block">
                  <span className="text-[11.5px] font-mono text-espresso2">PHONE</span>
                  <input type="tel" value={guestInfo.phone} onChange={(e) => setGuestInfo(g => ({ ...g, phone: e.target.value }))}
                    className="mt-1.5 w-full px-4 py-3 rounded-xl border border-line bg-white text-[14.5px] focus:outline-none focus:border-espresso/40" />
                </label>
                <label className="block sm:col-span-2">
                  <span className="text-[11.5px] font-mono text-espresso2">SPECIAL REQUESTS</span>
                  <textarea rows="3" value={guestInfo.requests} onChange={(e) => setGuestInfo(g => ({ ...g, requests: e.target.value }))}
                    className="mt-1.5 w-full px-4 py-3 rounded-xl border border-line bg-white text-[14.5px] focus:outline-none focus:border-espresso/40 resize-none" />
                </label>
              </div>
            </div>
          )}

          {step === 4 && (
            <div>
              <h2 className="text-[20px] font-semibold tracking-tight mb-6">Secure checkout</h2>
              <div className="grid sm:grid-cols-2 gap-4">
                <label className="block sm:col-span-2">
                  <span className="text-[11.5px] font-mono text-espresso2">CARD NUMBER</span>
                  <div className="mt-1.5 relative">
                    <CreditCardIcon size={16} className="absolute left-4 top-1/2 -translate-y-1/2 text-espresso2" />
                    <input placeholder="4242 4242 4242 4242" className="w-full pl-11 pr-4 py-3 rounded-xl border border-line bg-white text-[14.5px] focus:outline-none focus:border-espresso/40" />
                  </div>
                </label>
                <label className="block">
                  <span className="text-[11.5px] font-mono text-espresso2">EXPIRY</span>
                  <input placeholder="MM / YY" className="mt-1.5 w-full px-4 py-3 rounded-xl border border-line bg-white text-[14.5px] focus:outline-none focus:border-espresso/40" />
                </label>
                <label className="block">
                  <span className="text-[11.5px] font-mono text-espresso2">CVC</span>
                  <input placeholder="123" className="mt-1.5 w-full px-4 py-3 rounded-xl border border-line bg-white text-[14.5px] focus:outline-none focus:border-espresso/40" />
                </label>
              </div>
              <div className="flex items-center gap-2 mt-5 text-[12.5px] text-espresso2">
                <ShieldIcon size={14} /> Payments are encrypted end to end. You won't be charged until 24 hours before arrival.
              </div>
            </div>
          )}
        </Reveal>

        <Reveal delay={140} className="rounded-[28px] border border-line bg-white p-6 h-fit lg:sticky lg:top-24 shadow-sm">
          <h3 className="text-[13px] font-mono tracking-wide text-espresso2 mb-4">SUMMARY</h3>
          {room ? (
            <div className="flex items-center gap-3 pb-4 border-b border-line mb-4">
              <div className="w-12 h-12 rounded-lg overflow-hidden shrink-0">
                <img src={room.image} alt={room.name} className="w-full h-full object-cover" />
              </div>
              <div className="min-w-0">
                <div className="text-[14px] font-medium truncate">{room.name}</div>
                <div className="text-[12px] text-espresso2">{nights} night{nights > 1 ? "s" : ""} · {booking.guests} guests</div>
              </div>
            </div>
          ) : (
            <p className="text-[13.5px] text-espresso2 pb-4 border-b border-line mb-4">No room selected yet.</p>
          )}
          <div className="space-y-2 text-[13.5px]">
            <div className="flex justify-between"><span className="text-espresso2">Check-in</span><span>{booking.checkIn ? fmtDate(booking.checkIn) : "—"}</span></div>
            <div className="flex justify-between"><span className="text-espresso2">Check-out</span><span>{booking.checkOut ? fmtDate(booking.checkOut) : "—"}</span></div>
            {room && <div className="flex justify-between"><span className="text-espresso2">Room ({nights}n)</span><span className="font-mono">{money(roomTotal)}</span></div>}
            {booking.addons.length > 0 && <div className="flex justify-between"><span className="text-espresso2">Add-ons</span><span className="font-mono">{money(addonsTotal)}</span></div>}
          </div>
          <div className="flex justify-between items-center pt-4 mt-4 border-t border-line">
            <span className="text-[14px] font-medium">Total</span>
            <span className="text-[20px] font-semibold font-mono">{money(total)}</span>
          </div>
        </Reveal>
      </div>

      <div className="flex items-center justify-between mt-8">
        <button onClick={() => setStep(s => Math.max(0, s - 1))} disabled={step === 0}
          className="tap flex items-center gap-1.5 px-5 py-3 rounded-full text-[14px] font-medium disabled:opacity-0 hover:bg-cream2 transition-colors">
          <ChevronLeft size={16} /> Back
        </button>
        <PrimaryButton
          onClick={() => canNext[step] && setStep(s => Math.min(5, s + 1))}
          className={!canNext[step] ? "opacity-40 pointer-events-none" : ""}
          icon={step === 4 ? CheckIcon : ArrowRight}>
          {step === 4 ? "Confirm & Pay " + money(total) : "Continue"}
        </PrimaryButton>
      </div>
    </section>
  );
}

/* ============================== APP ============================== */
function App() {
  const hash = useHashRoute();
  const route = (hash.split("?")[0]) || "#/";
  const [booking, setBooking] = useState({
    checkIn: "", checkOut: "", guests: 2, selectedRoomId: null, addons: [],
  });
  const [bookingStep, setBookingStep] = useState(0);

  useEffect(() => { window.scrollTo(0, 0); }, [route]);

  const goBooking = useCallback((presetStep) => {
    setBookingStep(presetStep || 0);
    navigate("#/booking");
  }, []);

  const onSearch = useCallback(() => { goBooking(0); }, [goBooking]);
  const onBookRoom = useCallback((room) => {
    setBooking(b => ({ ...b, selectedRoomId: room.id }));
    goBooking(booking.checkIn && booking.checkOut ? 2 : 0);
  }, [goBooking, booking.checkIn, booking.checkOut]);
  const onBookGeneric = useCallback(() => goBooking(0), [goBooking]);

  let page;
  if (route === "#/rooms") page = <RoomsPage onBookRoom={onBookRoom} />;
  else if (route === "#/dining") page = <DiningPage />;
  else if (route === "#/experience") page = <ExperiencePage />;
  else if (route === "#/contact") page = <ContactPage />;
  else if (route === "#/booking") page = <BookingPage booking={booking} setBooking={setBooking} initialStep={bookingStep} key={bookingStep} />;
  else page = <HomePage booking={booking} setBooking={setBooking} onSearch={onSearch} onBook={onBookGeneric} />;

  return (
    <div className="min-h-screen flex flex-col">
      <Header route={route} onBook={onBookGeneric} />
      <main className="flex-1">{page}</main>
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
